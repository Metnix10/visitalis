<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Visitalis</title>

        <link rel="stylesheet" href="Styles/styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        
    </head>

    <body>

        <!--ENCABEZADO-->

        <header>

            <div class="logo">
                Visitalis
            </div>

            <div class="perfil">

            </div>

        </header>


        <!--MAGEN PRINCIPAL-->

        <section class="hero">

            <!-- BARRA DE BÚSQUEDA -->

            <div class="busqueda">

                <input
                    type="text"
                    placeholder="Buscar destinos, lugares, actividades..."
                >

            </div>

        </section>


        <!-- LUGARES DE INTERÉS-->

        <section class="lugares">

            <h2>
                Lugares de interés
            </h2>


            <div class="categorias">

                <!-- LOCALES -->

                <div class="categoria"
                    onclick="location.href='sitios.html'">

                    <div class="icono">
                        <img src="https://plus.unsplash.com/premium_photo-1697605026167-14bc81c13957?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="local">
                    </div>

                    <h3>
                        Locales
                    </h3>

                </div>


                <!-- NACIONALES -->

                <div class="categoria"
                    onclick="location.href='sitios.html'">

                    <div class="icono">
                        <img src="https://images.unsplash.com/photo-1585464231875-d9ef1f5ad396?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Nacionales">
                    </div>

                    <h3>
                        Nacionales
                    </h3>

                </div>


                <!-- NATURALES -->

                <div class="categoria"
                    onclick="location.href='sitios.html'">

                    <div class="icono">
                        <img src="https://images.unsplash.com/photo-1757368117014-c2b054211c8d?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="natural">
                    </div>

                    <h3>
                        Naturales
                    </h3>

                </div>

            </div>

        </section>

        <div class="chat">

            <!-- ENCABEZADO DEL CHAT -->

            <div class="chat-persona">

                <div class="avatar"></div>

                <div class="persona-info">

                    <strong>
                        Laura
                    </strong>

                    <span class="estado">
                        <span class="punto"></span>
                        En línea
                    </span>

                </div>

                <div class="flecha">
                    ›
                </div>

            </div>


            <!-- MENSAJES -->

            <div class="mensajes">

                <div class="mensaje recibido">
                Ejemplo de chat
                </div>

                <div class="mensaje enviado">
                Ejemplo de chat
                </div>

                <div class="mensaje recibido">
                Ejemplo de chat
                </div>

            </div>


            <!-- PESTAÑAS -->

            <div class="chat-tabs">

                <button class="chat-tab activo">
                    Chat individual
                </button>

                <button class="chat-tab">
                    Chat grupal
                </button>

            </div>


            <!-- Textp -->

            <div class="escribir">

                <input
                    type="text"
                    placeholder="Escribe un mensaje..."
                >

                <button>
                    >
                </button>

            </div>

            

        </div>

    <div class="contenedor-botones-flotantes">
        <a href="tareas.html" class="btn-flotante">
            Asignar tareas
        </a>

        <a href="recompensas.html" class="btn-flotante">
            Recompensas
        </a>
    </div>

    </body>
</html>
