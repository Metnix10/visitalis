<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Visitalis</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login">

        <div class="logo">
            Visitalis
        </div>

        <h1>Iniciar sesión</h1>

            <form id="formLogin">

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
                </div>

                <p id="mensaje"></p>

                <button type="submit">Iniciar sesión</button>

            </form>

            <script>
            document.getElementById('formLogin').addEventListener('submit', async (e) => {
                e.preventDefault(); //evita que el navegador recarge la pagina

                const mensaje = document.getElementById('mensaje');
                mensaje.textContent = '';

                const datos = {
                    correo: document.getElementById('correo').value.trim(),     //lee los valores de los datos
                    contrasena: document.getElementById('contrasena').value
                };

                try {
                    const res = await fetch('php/login.php', {  //envia el objeto en json y espera respuesta
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });

                    const texto = await res.text();
                    let data;
                    try {
                        data = JSON.parse(texto);
                    } catch {
                        console.log('Respuesta del servidor:', texto);
                        mensaje.textContent = 'El servidor respondió algo inesperado (revisa la consola, F12)';
                        return;
                    }

                    if (res.ok) { //si la respuesta salio bien
                        window.location.href = 'index.html';
                    } else {
                        mensaje.textContent = data.error;
                    }
                } catch (err) { //si el fetch no pudo llegar al servidor
                    console.error(err);
                    mensaje.textContent = 'No se pudo conectar con el servidor';
                }
            });
            </script>

    </div>

</body>
</html>
