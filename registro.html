<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Visitalis</title>

    <link rel="stylesheet" href="registro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="registro">

        <div class="logo">
            Visitalis
        </div>

        <h1>Crear cuenta</h1>

        <form id="formRegistro">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" minlength="6" required>
                </div>

                <p id="mensaje"></p>

                <button type="submit">Crear cuenta</button>

        </form>

        <script>
            document.getElementById('formRegistro').addEventListener('submit', async (e) => {
                e.preventDefault();

                const mensaje = document.getElementById('mensaje');
                mensaje.textContent = '';

                const datos = {
                    nombre: document.getElementById('nombre').value.trim(), //lee los valores
                    correo: document.getElementById('correo').value.trim(),
                    contrasena: document.getElementById('contrasena').value
                };

                try {
                    const res = await fetch('php/registro.php', { //manda el objeto
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });

                    const texto = await res.text();
                    console.log('Respuesta del servidor:', texto);

                    let data;
                    try {
                        data = JSON.parse(texto); // hubo un error
                    } catch {
                        mensaje.textContent = 'El servidor respondió algo inesperado (revisa la consola, F12)';
                        return;
                    }

                    if (res.ok) { //respuesta exitosa
                        window.location.href = 'login.html';
                    } else {
                        mensaje.textContent = data.error;
                    }
                } catch (err) { // el fetch no llego al servidor
                    console.error(err);
                    mensaje.textContent = 'No se pudo conectar con el servidor';
                }
            });
        </script>

    </div>

</body>
</html>
